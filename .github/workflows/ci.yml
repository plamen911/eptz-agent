name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y -q bubblewrap socat
      - run: npm run vendor:plugin
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:plugin
      - if: failure()
        run: |
          B=node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude
          ls -l $B; file $B; ldd $B || true
          $B --version || echo "exit $?"
          ls node_modules/@anthropic-ai/
